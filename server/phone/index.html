<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0c" />
    <title>Peça sua música</title>
    <link rel="stylesheet" href="/phone.css" />
  </head>
  <body>
    <header class="top">
      <span class="kicker">Karaokê</span>
      <h1 id="title">Peça sua música</h1>
    </header>

    <main>
      <section id="nokey" class="card notice" hidden>
        <strong>Leia o QR code da tela</strong>
        <p>Este link está incompleto. Aponte a câmera do celular para o QR code mostrado na tela do karaokê.</p>
      </section>

      <section id="app" hidden>
        <label class="field">
          <span>Seu nome</span>
          <input id="singer" maxlength="40" autocomplete="nickname" placeholder="Como o DJ vai te chamar" />
        </label>

        <label class="field">
          <span>Música</span>
          <input id="q" type="search" placeholder="Busque por música ou artista" autocomplete="off" />
        </label>
        <p id="hint" class="hint"></p>
        <ul id="results" class="results"></ul>

        <div id="yt-box" class="yt-box" hidden>
          <button id="yt-btn" class="yt-btn" type="button">Não achou? Buscar no YouTube</button>
          <p id="yt-hint" class="hint"></p>
          <ul id="yt-results" class="results"></ul>
        </div>

        <section id="mine-box" class="card" hidden>
          <h2>Seus pedidos</h2>
          <ul id="mine" class="mine"></ul>
        </section>
      </section>
    </main>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card">
        <span class="kicker">Você vai cantar</span>
        <strong id="pick-title"></strong>
        <em id="pick-artist"></em>
        <p id="sheet-error" class="error" hidden></p>
        <button id="send" class="primary">Pedir esta música</button>
        <button id="cancel" class="ghost">Escolher outra</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="/phone.js"></script>
  </body>
</html>
